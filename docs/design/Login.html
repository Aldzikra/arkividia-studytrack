<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>StudyTrack — Masuk</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#1A5FD6}a:hover{color:#123F8F}
button,input{font-family:inherit}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0F1B33; background: #FFFFFF;">

  <section aria-hidden="true" style="flex: 1 1 420px; box-sizing: border-box; background: #2373F4; color: #FFFFFF; padding: 48px; display: flex; flex-direction: column; justify-content: space-between; gap: 40px; position: relative; overflow: hidden; min-height: 320px;">
    <div style="position: absolute; right: -80px; top: -80px; width: 280px; height: 280px; border-radius: 50%; background: #578EF5;"></div>
    <div style="position: absolute; right: 60px; bottom: 90px; width: 120px; height: 120px; border-radius: 28px; background: #65D0F4; transform: rotate(12deg);"></div>
    <div style="position: absolute; right: 200px; bottom: 40px; width: 64px; height: 64px; border-radius: 50%; background: #F2F7A0;"></div>

    <div style="display: flex; align-items: center; gap: 10px; position: relative;">
      <div style="width: 40px; height: 40px; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; justify-content: center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2373F4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V6a2 2 0 0 1 2-2h12v15H6a2 2 0 0 0-2 2"></path><path d="M9 9l2 2 4-4"></path></svg>
      </div>
      <span style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em;">StudyTrack</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px; max-width: 420px; position: relative;">
      <h2 style="margin: 0; font-size: 40px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em;">Semua tugas kuliah, satu daftar.</h2>
      <p style="margin: 0; font-size: 17px; line-height: 1.6; color: #FFFFFF;">Deadline yang tinggal kurang dari 24 jam langsung naik ke paling atas, jadi tidak ada yang terlewat.</p>
    </div>
  </section>

  <main style="flex: 1 1 420px; box-sizing: border-box; padding: 48px; display: flex; align-items: center; justify-content: center;">
    <form style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 20px;">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em;">Masuk</h1>
        <p style="margin: 0; font-size: 15px; color: #55627A;">Masuk dengan email dan password akunmu.</p>
      </div>

      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #3B4863;">
        Email
        <input type="email" placeholder="nama@kampus.ac.id" autocomplete="email" style="min-height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #C4D2EC; font-size: 15px; color: #0F1B33; background: #FFFFFF;">
      </label>

      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #3B4863;">
        Password
        <input type="password" placeholder="Minimal 8 karakter" autocomplete="current-password" style="min-height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #C4D2EC; font-size: 15px; color: #0F1B33; background: #FFFFFF;">
      </label>

      <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 12px; background: #1A5FD6; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none;">Masuk</a>

      <p style="margin: 0; font-size: 14px; color: #55627A; text-align: center;">Belum punya akun? <a href="Login.dc.html" style="font-weight: 700;">Daftar</a></p>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
