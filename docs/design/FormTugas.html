<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>StudyTrack — Tambah Tugas</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F7FD}
a{color:#1A5FD6}a:hover{color:#123F8F}
button,input,select,textarea{font-family:inherit}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0F1B33; background: #F4F7FD;">

  <nav aria-label="Navigasi utama" style="flex: 1 1 240px; max-width: 100%; box-sizing: border-box; background: #FFFFFF; border-right: 1px solid #DCE5F5; padding: 28px 20px; display: flex; flex-direction: column; gap: 32px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="width: 36px; height: 36px; border-radius: 10px; background: #2373F4; display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V6a2 2 0 0 1 2-2h12v15H6a2 2 0 0 0-2 2"></path><path d="M9 9l2 2 4-4"></path></svg>
      </div>
      <span style="font-size: 19px; font-weight: 800; letter-spacing: -0.02em;">StudyTrack</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <a href="Main.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 14px; border-radius: 10px; background: #E8F0FE; color: #1A5FD6; font-weight: 700; font-size: 15px; text-decoration: none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"></path><path d="M4 6h.01M4 12h.01M4 18h.01"></path></svg>
        Daftar Tugas
      </a>
      <a href="MataKuliah.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 14px; border-radius: 10px; color: #3B4863; font-weight: 600; font-size: 15px; text-decoration: none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 7l10-4 10 4-10 4z"></path><path d="M6 9v5c0 1.7 2.7 3 6 3s6-1.3 6-3V9"></path></svg>
        Mata Kuliah
      </a>
    </div>
    <div style="margin-top: auto; display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; background: #F4F7FD;">
      <div style="width: 36px; height: 36px; border-radius: 50%; background: #65D0F4; color: #0B3A4A; font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center;">AZ</div>
      <div style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1;">
        <span style="font-size: 14px; font-weight: 700;">aldzikra</span>
        <span style="font-size: 12px; color: #55627A; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">[email@kampus.ac.id]</span>
      </div>
      <a href="Login.dc.html" aria-label="Keluar" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #55627A; border-radius: 10px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"></path><path d="M10 17l-5-5 5-5"></path><path d="M5 12h11"></path></svg>
      </a>
    </div>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 36px 40px 56px;">
    <div style="max-width: 680px; width: 100%; display: flex; flex-direction: column; gap: 24px;">

      <a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-size: 14px; font-weight: 700; text-decoration: none; align-self: flex-start;">← Kembali ke Daftar Tugas</a>

      <h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.02em;">Tambah Tugas</h1>

      <form style="background: #FFFFFF; border: 1px solid #DCE5F5; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 20px;">
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #3B4863;">
          Judul tugas
          <input type="text" placeholder="Lab 4: Query Optimization Report" style="min-height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1px solid #C4D2EC; font-size: 15px; color: #0F1B33; background: #FFFFFF;">
        </label>

        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #3B4863;">
          Mata kuliah
          <select style="min-height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1px solid #C4D2EC; font-size: 15px; color: #0F1B33; background: #FFFFFF;">
            <option>CS 186 · Database Systems</option>
            <option>CS 61B · Data Structures</option>
            <option>CS 169 · Software Engineering</option>
          </select>
        </label>

        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #3B4863;">
          Deskripsi <span style="font-weight: 500; color: #55627A;">(opsional)</span>
          <textarea rows="4" placeholder="Catatan atau detail tugas" style="box-sizing: border-box; padding: 12px 14px; border-radius: 10px; border: 1px solid #C4D2EC; font-size: 15px; color: #0F1B33; background: #FFFFFF; resize: vertical;"></textarea>
        </label>

        <fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px;">
          <legend style="padding: 0; margin-bottom: 6px; font-size: 13px; font-weight: 700; color: #3B4863;">Deadline</legend>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #55627A;">
              Tanggal
              <input type="date" value="2026-07-03" style="min-height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1px solid #C4D2EC; font-size: 15px; color: #0F1B33; background: #FFFFFF;">
            </label>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #55627A;">
              Jam (WIB)
              <input type="time" value="23:59" style="min-height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1px solid #C4D2EC; font-size: 15px; color: #0F1B33; background: #FFFFFF;">
            </label>
          </div>
          <div style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; background: #EAF8FD; color: #0B4A5E; font-size: 13px; font-weight: 500; line-height: 1.5;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px;"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>
            <span>Saat sisa waktunya kurang dari 24 jam, tugas ini otomatis ditandai dan dipindah ke bagian paling atas daftar.</span>
          </div>
        </fieldset>

        <div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 12px; padding-top: 4px;">
          <a href="Main.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 12px; border: 1px solid #C4D2EC; color: #3B4863; font-size: 15px; font-weight: 700; text-decoration: none;">Batal</a>
          <button type="submit" style="min-height: 44px; padding: 0 24px; border-radius: 12px; border: none; background: #1A5FD6; color: #FFFFFF; font-size: 15px; font-weight: 700; cursor: pointer;">Simpan Tugas</button>
        </div>
      </form>

    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
