<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>StudyTrack Mobile — Tambah Tugas</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1A5FD6}a:hover{color:#123F8F}
button,input,select,textarea{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 980px; box-sizing: border-box; background: #F4F7FD; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0F1B33; display: flex; flex-direction: column;">

  <header style="background: #FFFFFF; border-bottom: 1px solid #DCE5F5; padding: 10px 12px; display: flex; align-items: center; gap: 4px;">
    <a href="MobileTugas.dc.html" aria-label="Kembali" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: #0F1B33;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 18px; font-weight: 800;">Tambah Tugas</h1>
  </header>

  <form style="flex-grow: 1; padding: 20px; display: flex; flex-direction: column; gap: 18px;">
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #3B4863;">
      Judul tugas
      <input type="text" placeholder="Lab 4: Query Optimization Report" style="min-height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #C4D2EC; font-size: 16px; color: #0F1B33; background: #FFFFFF;">
    </label>

    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #3B4863;">
      Mata kuliah
      <select style="min-height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #C4D2EC; font-size: 16px; color: #0F1B33; background: #FFFFFF;">
        <option>CS 186 · Database Systems</option>
        <option>CS 61B · Data Structures</option>
        <option>CS 169 · Software Engineering</option>
      </select>
    </label>

    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #3B4863;">
      Deskripsi <span style="font-weight: 500; color: #55627A;">(opsional)</span>
      <textarea rows="4" placeholder="Catatan atau detail tugas" style="box-sizing: border-box; padding: 12px 14px; border-radius: 12px; border: 1px solid #C4D2EC; font-size: 16px; color: #0F1B33; background: #FFFFFF; resize: vertical;"></textarea>
    </label>

    <fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px;">
      <legend style="padding: 0; margin-bottom: 6px; font-size: 13px; font-weight: 700; color: #3B4863;">Deadline</legend>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #55627A;">
        Tanggal
        <input type="date" value="2026-07-03" style="min-height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #C4D2EC; font-size: 16px; color: #0F1B33; background: #FFFFFF;">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #55627A;">
        Jam (WIB)
        <input type="time" value="23:59" style="min-height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #C4D2EC; font-size: 16px; color: #0F1B33; background: #FFFFFF;">
      </label>
      <div style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: #EAF8FD; color: #0B4A5E; font-size: 13px; font-weight: 500; line-height: 1.5;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px;"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>
        <span>Saat sisa waktunya kurang dari 24 jam, tugas ini otomatis ditandai dan naik ke paling atas daftar.</span>
      </div>
    </fieldset>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px;">
      <button type="submit" style="min-height: 52px; border-radius: 14px; border: none; background: #1A5FD6; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer;">Simpan Tugas</button>
      <a href="MobileTugas.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 14px; color: #3B4863; font-size: 15px; font-weight: 700; text-decoration: none;">Batal</a>
    </div>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":980}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
