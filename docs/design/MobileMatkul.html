<div style="width: 390px; height: 900px; box-sizing: border-box; background: #F4F7FD; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0F1B33; display: flex; flex-direction: column;">

  <header style="background: #FFFFFF; border-bottom: 1px solid #DCE5F5; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between;">
    <div style="display: flex; align-items: center; gap: 8px;">

  </header>

  <main style="flex-grow: 1; padding: 20px; display: flex; flex-direction: column; gap: 18px;">
    <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em;">Mata Kuliah</h1>

    <form aria-label="Tambah mata kuliah" style="background: #FFFFFF; border: 1px solid #DCE5F5; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px;">

        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700; color: #3B4863;">
          Kode
          <input type="text" placeholder="CS 186" style="min-height: 44px; width: 100%; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #C4D2EC; font-size: 16px; color: #0F1B33; background: #FFFFFF;">
        </label>
        <label style="grid-column: span 2; display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700; color: #3B4863;">
          Nama mata kuliah
          <input type="text" placeholder="Database Systems" style="min-height: 44px; width: 100%; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #C4D2EC; font-size: 16px; color: #0F1B33; background: #FFFFFF;">
        </label>
      </div>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700; color: #3B4863;">
        Dosen pengampu
        <input type="text" placeholder="Nama dosen" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #C4D2EC; font-size: 16px; color: #0F1B33; background: #FFFFFF;">
      </label>
      <button type="submit" style="min-height: 48px; border-radius: 12px; border: none; background: #1A5FD6; color: #FFFFFF; font-size: 15px; font-weight: 700; cursor: pointer;">Tambah Mata Kuliah</button>
    </form>

    <section aria-label="Daftar mata kuliah" style="display: flex; flex-direction: column; gap: 10px;">
      <article style="background: #FFFFFF; border: 1px solid #DCE5F5; border-radius: 16px; padding: 12px 8px 12px 16px; display: flex; align-items: center; gap: 12px;">
        <span style="width: 64px; flex-shrink: 0; padding: 6px 0; text-align: center; border-radius: 8px; background: #E8F0FE; color: #1A5FD6; font-size: 12px; font-weight: 800;">CS 186</span>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <h2 style="margin: 0; font-size: 15px; font-weight: 700;">Database Systems</h2>
          <span style="font-size: 13px; color: #55627A;">[Nama dosen]</span>
        </div>
        <button type="button" aria-label="Opsi CS 186" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 10px; border: none; background: transparent; color: #55627A; cursor: pointer; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5h.01M12 12h.01M12 19h.01"></path></svg></button>
      </article>
      <article style="background: #FFFFFF; border: 1px solid #DCE5F5; border-radius: 16px; padding: 12px 8px 12px 16px; display: flex; align-items: center; gap: 12px;">
        <span style="width: 64px; flex-shrink: 0; padding: 6px 0; text-align: center; border-radius: 8px; background: #E8F0FE; color: #1A5FD6; font-size: 12px; font-weight: 800;">CS 61B</span>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <h2 style="margin: 0; font-size: 15px; font-weight: 700;">Data Structures</h2>
          <span style="font-size: 13px; color: #55627A;">[Nama dosen]</span>
        </div>
        <button type="button" aria-label="Opsi CS 61B" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 10px; border: none; background: transparent; color: #55627A; cursor: pointer; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5h.01M12 12h.01M12 19h.01"></path></svg></button>
      </article>
      <article style="background: #FFFFFF; border: 1px solid #DCE5F5; border-radius: 16px; padding: 12px 8px 12px 16px; display: flex; align-items: center; gap: 12px;">
        <span style="width: 64px; flex-shrink: 0; padding: 6px 0; text-align: center; border-radius: 8px; background: #E8F0FE; color: #1A5FD6; font-size: 12px; font-weight: 800;">CS 169</span>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <h2 style="margin: 0; font-size: 15px; font-weight: 700;">Software Engineering</h2>
          <span style="font-size: 13px; color: #55627A;">[Nama dosen]</span>
        </div>
        <button type="button" aria-label="Opsi CS 169" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 10px; border: none; background: transparent; color: #55627A; cursor: pointer; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5h.01M12 12h.01M12 19h.01"></path></svg></button>
      </article>
    </section>
  </main>

  <nav aria-label="Navigasi utama" style="background: #FFFFFF; border-top: 1px solid #DCE5F5; padding: 8px 12px 20px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px;">
    <a href="MobileTugas.dc.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 12px; color: #55627A; font-size: 12px; font-weight: 700; text-decoration: none;">
      <span style="padding: 3px 16px; display: flex;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"></path><path d="M4 6h.01M4 12h.01M4 18h.01"></path></svg></span>
      Tugas

    <a href="MobileMatkul.dc.html" aria-current="page" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 12px; color: #1A5FD6; font-size: 12px; font-weight: 800; text-decoration: none;">
      <span style="padding: 3px 16px; border-radius: 999px; background: #E8F0FE; display: flex;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 7l10-4 10 4-10 4z"></path><path d="M6 9v5c0 1.7 2.7 3 6 3s6-1.3 6-3V9"></path></svg></span>

    <a href="MobileLogin.dc.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 12px; color: #55627A; font-size: 12px; font-weight: 700; text-decoration: none;">
      <span style="padding: 3px 16px; display: flex;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"></path><path d="M10 17l-5-5 5-5"></path><path d="M5 12h11"></path></svg></span>
      Keluar

  </nav>
</div>
